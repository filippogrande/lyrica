name: Immagini mancanti

# Un click e basta: cerca le immagini che mancano (foto delle band e cover degli
# album), le scarica dagli archivi pubblici e apre una PR con tutte insieme.
#
# Niente MBID da copiare a mano: la band si riconosce dal nome in band.md,
# l'album dal titolo e dall'anno in album.md (D86).
#
# Chiavi fanart.tv: secret del repo FANART_API_KEY / FANART_CLIENT_KEY (servono
# solo per le foto delle band: le cover non richiedono chiavi).
#
# Il report con gli esiti finisce nel riepilogo del run (Summary): leggi quello
# prima di mergiare, perché la corrispondenza è automatica (D86).
#
# La PR la apre il workflow e la mergia Filippo: il workflow non merge mai.
#
# Un'immagine che non riesce NON deve far perdere le altre: il passo che scarica
# non blocca il job (continue-on-error), così la PR si apre lo stesso con quelle
# riuscite, e il job risulta rosso alla fine per segnalare che qualcosa è andato
# storto (il motivo sta nel report).

on:
  workflow_dispatch:
    inputs:
      band:
        description: "Opzionale: una sola band (slug). Vuoto = tutte le band."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH_IMMAGINI: immagini/mancanti

jobs:
  immagini:
    name: Cerca, scarica e apri la PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Il branch delle immagini si porta in pari con main PRIMA di scaricare:
      # così il push è un fast-forward e, soprattutto, un'immagine non viene
      # committata sopra una versione vecchia di un file di contenuto (che
      # rimetterebbe dentro quello che main ha già cambiato).
      # La storia completa del branch serve: con --depth 1 git non vede
      # l'antenato comune e il merge con main fallisce per «unrelated histories».
      - name: Porta il branch delle immagini in pari con main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 1 origin main
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if git ls-remote --exit-code --heads origin "$BRANCH_IMMAGINI" >/dev/null 2>&1; then
            git fetch --no-tags origin "$BRANCH_IMMAGINI:refs/remotes/origin/$BRANCH_IMMAGINI"
            git checkout -B "$BRANCH_IMMAGINI" "origin/$BRANCH_IMMAGINI"
            if ! git merge --no-edit "$MAIN_SHA"; then
              echo "::error::conflitto fra ${BRANCH_IMMAGINI} e main: va risolto a mano, il branch non è stato toccato"
              exit 1
            fi
            echo "branch esistente, portato in pari con main (${MAIN_SHA})"
          else
            echo "branch nuovo: parto da main (${MAIN_SHA})"
          fi

      - name: ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick

      # L'input passa dall'ambiente, non interpolato nel comando: un valore
      # scritto a mano non deve poter eseguire codice nel runner.
      - name: Riempie le immagini mancanti
        id: scarica
        continue-on-error: true
        env:
          BAND: ${{ inputs.band }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          FANART_CLIENT_KEY: ${{ secrets.FANART_CLIENT_KEY }}
        run: bash scripts/fetch-images.sh "$BAND"

      - name: Commit, branch e PR
        env:
          GH_TOKEN: ${{ github.token }}
          BAND: ${{ inputs.band }}
        run: |
          set -euo pipefail
          # Un input vuoto resta una variabile impostata: il default va chiesto
          # con :- , non con : (cioe' «${BAND:-tutte le band}» e mai «${BAND:x}»).
          ETICHETTA="${BAND:-tutte le band}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_IMMAGINI"
          if [ -d covers ]; then git add covers; fi
          git add content
          if git diff --cached --quiet; then
            echo "::notice::nessuna immagine nuova: non c'è niente da committare"
            exit 0
          fi
          FILE="$(git diff --cached --numstat | wc -l)"
          git commit -m "content(immagini): riempie le immagini mancanti (${ETICHETTA})"
          git push -u origin "$BRANCH_IMMAGINI"
          APERTA="$(gh pr list --head "$BRANCH_IMMAGINI" --json number --jq '.[0].number // empty')"
          if [ -n "$APERTA" ]; then
            echo "::notice::PR già aperta e aggiornata: https://github.com/${GITHUB_REPOSITORY}/pull/${APERTA}"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH_IMMAGINI" \
            --title "content(immagini): riempie le immagini mancanti" \
            --body "Immagini scaricate dagli archivi pubblici (Cover Art Archive per le cover, fanart.tv per le foto delle band) e convertite in 600x600 webp.

          File toccati: ${FILE}

          **Da guardare e approvare a mano.** La corrispondenza è automatica (nome della band; titolo e anno dell'album), quindi può pescare la release sbagliata (live, compilation, edizione estera). Il report degli esiti è nel riepilogo di questo run: Actions -> il run -> Summary."

      # Il job resta rosso se qualche immagine non è riuscita, ma la PR è già
      # aperta: il rosso è il promemoria, non la perdita del lavoro fatto.
      - name: Segnala le immagini non riuscite
        if: steps.scarica.outcome == 'failure'
        run: |
          echo "::error::alcune immagini non sono riuscite: guarda il report nel riepilogo del run"
          exit 1
