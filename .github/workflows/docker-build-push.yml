name: Build and push Docker image

# Stessa convenzione degli altri repo: push su main -> immagine su Docker Hub,
# con tag :latest e :<sha>. Il deploy sul home-lab resta un'azione manuale
# (docker compose pull && docker compose up -d), vedi DEPLOY.md.

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lyrica:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lyrica:${{ github.sha }}
