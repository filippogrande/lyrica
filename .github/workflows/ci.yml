name: CI

# La CI fa quattro cose:
#   1. verifica che il progetto COMPILI (la compilazione non è possibile
#      nell'ambiente dell'agente, quindi è qui che gli errori emergono);
#   2. esegue i TEST UNITARI del codice (go test ./...): test stabili, che
#      restano nel repo, mai file usa-e-getta (D98);
#   3. valida i CONTENUTI: una traduzione incompleta o uno slug sbagliato
#      rendono la PR rossa, prima del merge;
#   4. GENERA il sito (`lyrica build`): se un template non rende, si vede qui e
#      non in produzione.
# Il log del job non è leggibile dall'API (serve il login): gli errori di templ e
# dei test si rimandano come annotation, che invece si leggono.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # TEMPORANEO: la diagnostica in fondo al job compila pubblica il log come
  # commento della PR, così l'errore è leggibile anche dall'agente. Va tolto
  # insieme al passo "Diagnostica".
  pull-requests: write

jobs:
  compila:
    name: Compila
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Go 1.27.1
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Risolvi le dipendenze
        run: go mod tidy

      # L'errore di templ finisce nel log del job, che non è leggibile dall'API:
      # lo si rimanda come annotation (leggibile) invece di lasciarlo invisibile.
      - name: Genera i template Templ
        run: |
          if ! go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate > /tmp/templ.log 2>&1; then
            echo "::error::templ generate fallito: $(awk '{printf "%s%%0A", $0}' /tmp/templ.log | head -c 1200)"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # I test girano sui template già generati: il pacchetto render li importa.
      # Come per templ, il fallimento si rimanda come annotation: senza, l'unico
      # modo di sapere quale test è rosso è aprire il log a mano.
      - name: Test
        run: |
          if ! go test ./... > /tmp/test.log 2>&1; then
            echo "::error::go test fallito: $(awk '{printf "%s%%0A", $0}' /tmp/test.log | head -c 3000)"
            exit 1
          fi

      # TEMPORANEO: pubblica il log della CI come commento della PR, così anche
      # l'agente lo legge (il log del job richiede il login). Da rimuovere
      # insieme al permesso pull-requests: write.
      - name: Diagnostica (temporanea)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          {
            echo "## Diagnostica CI (temporanea)"
            echo
            echo '### go vet'
            go vet ./... 2>&1 | tail -c 3000
            echo
            echo '### go build'
            go build ./... 2>&1 | tail -c 3000
            echo
            echo '### go test'
            go test ./... 2>&1 | tail -c 8000
          } > /tmp/diag.txt
          if [ -n "${PR}" ]; then
            gh pr comment "${PR}" --body-file /tmp/diag.txt || echo "commento non riuscito"
          fi

  valida:
    name: Valida e genera
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Go 1.27.1
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Risolvi le dipendenze
        run: go mod tidy

      # Il comando importa internal/web e internal/render (i template generati):
      # senza questo passo non compila.
      - name: Genera i template Templ
        run: |
          if ! go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate > /tmp/templ.log 2>&1; then
            echo "::error::templ generate fallito: $(awk '{printf "%s%%0A", $0}' /tmp/templ.log | head -c 1200)"
            exit 1
          fi

      - name: Valida i contenuti
        run: go run ./cmd/lyrica valida

      # Questa è la verifica vera: rende ogni pagina dai contenuti reali.
      - name: Genera il sito
        run: go run ./cmd/lyrica build

      - name: Controlla che le pagine attese esistano
        run: |
          test -f public/it/index.html
          test -f public/it/bands/index.html
          test -f public/en/index.html
          echo "pagine generate:"
          find public -name '*.html' | sort
