name: CI

# La CI fa tre cose:
#   1. verifica che il progetto COMPILI (la compilazione non è possibile
#      nell'ambiente dell'agente, quindi è qui che gli errori emergono);
#   2. valida i CONTENUTI: una traduzione incompleta o uno slug sbagliato
#      rendono la PR rossa, prima del merge;
#   3. GENERA il sito (`lyrica build`): se un template non rende, si vede qui e
#      non in produzione.
# Non ci sono test unitari per scelta: vedi GUIDELINES.md §6.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compila:
    name: Compila
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Go 1.27.1
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Risolvi le dipendenze
        run: go mod tidy

      # L'errore di templ finisce nel log del job, che non è leggibile dall'API:
      # lo si rimanda come annotation (leggibile) invece di lasciarlo invisibile.
      - name: Genera i template Templ
        run: |
          if ! go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate > /tmp/templ.log 2>&1; then
            echo "::error::templ generate fallito: $(awk '{printf "%s%%0A", $0}' /tmp/templ.log | head -c 1200)"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  valida:
    name: Valida e genera
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Go 1.27.1
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Risolvi le dipendenze
        run: go mod tidy

      # Il comando importa internal/web e internal/render (i template generati):
      # senza questo passo non compila.
      - name: Genera i template Templ
        run: |
          if ! go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate > /tmp/templ.log 2>&1; then
            echo "::error::templ generate fallito: $(awk '{printf "%s%%0A", $0}' /tmp/templ.log | head -c 1200)"
            exit 1
          fi

      - name: Valida i contenuti
        run: go run ./cmd/lyrica valida

      # Questa è la verifica vera: rende ogni pagina dai contenuti reali.
      - name: Genera il sito
        run: go run ./cmd/lyrica build

      - name: Controlla che le pagine attese esistano
        run: |
          test -f public/it/index.html
          test -f public/it/bands/index.html
          test -f public/en/index.html
          echo "pagine generate:"
          find public -name '*.html' | sort
