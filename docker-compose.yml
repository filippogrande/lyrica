# Compose di Lyrica — sito statico, nessun database, nessuno stato.
#
# Da usare sul home-lab in /mnt/applicazioni/yml/docker/lyrica/
# (stessa convenzione degli altri servizi). Aggiornamento:
#   docker compose pull
#   docker compose up -d

services:
  web:
    image: filippogrande/lyrica:latest
    pull_policy: always
    ports:
      # host:container — la porta host e' da confermare libera (vedi DEPLOY.md)
      - "8085:8080"
    environment:
      # Default sicuro: il container parte anche senza .env.
      - LYRICA_ADDR=:8080
    env_file:
      # .env non e' nel repo: si crea dal template .env.example (DEPLOY.md).
      # required: false -> il primo `docker compose up -d` non fallisce se il
      # file non c'e' ancora. I segreti (bot Telegram, Umami) arrivano da qui:
      # mai scritti nel compose, mai committati.
      - path: .env
        required: false
    restart: unless-stopped
