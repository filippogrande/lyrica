# Compose di Lyrica — sito statico, nessun database, nessuno stato.
#
# Sta in deploy/ nel repo; sul home-lab vive in
# /mnt/applicazioni/yml/docker/lyrica/ insieme alla sua .env.
# Aggiornamento: docker compose pull && docker compose up -d

services:
  web:
    image: filippogrande/lyrica:latest
    pull_policy: always
    ports:
      # host:container — la porta host e' quella libera sulla macchina che ospita
      # il sito: sul master e' la 8097 (8090-8096 sono occupate). Se e' occupata
      # anche la tua, si cambia SOLO questo numero: e' una riga, non un deploy.
      - "8097:8080"
    environment:
      # Default sicuro: il container parte anche senza .env.
      - LYRICA_ADDR=:8080
    env_file:
      # .env non e' nel repo: si crea dal template .env.example (docs/ARCHITECTURE.md).
      # required: false -> il primo `docker compose up -d` non fallisce se il
      # file non c'e' ancora. I segreti (bot Telegram, Umami) arrivano da qui:
      # mai scritti nel compose, mai committati.
      - path: .env
        required: false
    restart: unless-stopped
